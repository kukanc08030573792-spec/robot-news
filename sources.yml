# ============================================================
# ロボットニュース収集 設定ファイル
# このファイルを編集すれば、収集対象を自由に増減できます。
# GitHubのWeb画面から直接編集 → コミットでOK（次回実行から反映）
# ============================================================

# ---- 専門メディアのRSSフィード ----
rss_feeds:
  # /feed はWordPress形式のパスで、このサイトでは404になる。
  # サイトが <link rel="alternate"> で宣言しているURLがこちら。
  - name: ロボスタ
    url: https://robotstart.info/rss20/index.rdf
  - name: The Robot Report
    url: https://www.therobotreport.com/feed/

# ---- Google News キーワード検索（日本語） ----
# 1行1キーワード。OR検索可。ここが収集の主力ネットです。
google_news_queries:
  - 清掃ロボット
  - 床洗浄ロボット OR 床清掃ロボット
  - 業務用清掃ロボット
  - サービスロボット
  - 配膳ロボット OR 案内ロボット OR 警備ロボット
  - ビルメンテナンス ロボット
  - ビルクリーニング ロボット
  - ヒューマノイドロボット   # ロボット全般枠。大きなニュースのみAIが採用判定

# ---- YouTubeチャンネル監視 ----
# channel_id（UCで始まるID）または handle（@名）で指定。
# handleは実行時にIDへ自動解決します（解決できない場合はスキップしてログに出ます）。
# チャンネルIDの調べ方：チャンネルページ → 概要 → 「チャンネルを共有」→「チャンネルIDをコピー」
youtube_channels:
  - name: ロボスタ
    channel_id: UClhI_701H52xh38IlX8P5zw
  - name: Pudu Robotics
    channel_id: UCyLr5trvV9Y_lWS5AmBQvTw
  - name: Gausium
    channel_id: UCdZ_QJPUya9rLs6tS9ptuKw
  - name: ソフトバンクロボティクス
    handle: softbankrobotics7632
  - name: アマノ
    handle: amano1931
  - name: LionsBot International
    channel_id: UC2h7bvUPgfgAU2y5lyfTWdw
  - name: Tennant Company
    handle: TennantCompany
  # - name: 例）ハンドル（@名）で指定する場合
  #   handle: CHANNELHANDLE

# ---- 有識者リンク集（サイトの「有識者」タブに表示） ----
# X（Twitter）は自動収集できないため、手動チェック用のリンク集として表示します。
# rss を指定すると（note・ブログ・Bluesky等）、その人の投稿も自動収集対象になります。
# ※ 初期エントリは例です。実際にフォローしたい方に差し替えてください。
experts:
  - name: ロボットスタート（ロボスタ）公式X
    x_url: https://x.com/robotstart
    note: ロボット業界ニュース速報
  - name: ソフトバンクロボティクス公式X
    x_url: https://x.com/sbr_corp
    note: Whiz等・国内清掃ロボ最大手の製品・事例情報
  - name: Pudu Robotics Japan公式X
    x_url: https://x.com/Pudu__Japan
    note: 清掃・配膳ロボ大手（中国系）の日本法人
  - name: DFA Robotics公式X
    x_url: https://x.com/DFAroboticsInc
    note: 配膳・清掃ロボの国内大手代理店。導入事例が豊富
  # - name: 例）note併用の有識者（実際にフォローしたい方に差し替えてください）
  #   x_url: https://x.com/USERNAME
  #   rss: https://note.com/USERNAME/rss
  #   note: rssを書くと投稿が自動収集されます

# ---- 分類の指針 ----
# 判定は scripts/collect.py の classify() がキーワードで行う（AIは使わない）。
classification:
  # cleaning: 清掃ロボット・清掃技術に直接関係
  # adjacent: 業務用サービスロボット（配膳・警備・案内・配送等）、ビルメンテナンスDX
  # general:  上記以外のロボット・自動化の話題
  # skip:     ロボットと無関係（Google News由来の記事にのみ適用。
  #           専門メディア・メーカー公式チャンネル・有識者の記事は常に採用する）
  max_summary_chars: 160

# ---- 日本語訳の設定 ----
# 英語（および日本語以外）の記事タイトル・要約を日本語に訳す。
# Google Cloud Translation API v2 を使う。月50万字まで無料。
#
# 【準備】1回だけ
#  1. https://console.cloud.google.com でプロジェクト analytics-501706 を開く
#  2. 「APIとサービス」→ ライブラリ →「Cloud Translation API」を有効にする
#  3. 「APIとサービス」→ 認証情報 →「認証情報を作成」→「APIキー」
#     作成後「キーを制限」→ API制限で「Cloud Translation API」だけを選ぶ
#     ※ 月次レポートで使っているサービスアカウント鍵は流用しない。
#       公開リポジトリにGA4の権限を持ち込まないため、翻訳専用のキーを作る。
#  4. GitHubのリポジトリ → Settings → Secrets and variables → Actions
#     → New repository secret で Name を GOOGLE_TRANSLATE_API_KEY にして貼る
#
# キーをこのファイルやスクリプトに直接書かないこと（このリポジトリは公開設定）。
translate:
  enabled: true
  api_key_env: GOOGLE_TRANSLATE_API_KEY
  batch_size: 20         # 1リクエストにまとめるテキスト数


# ---- 動作設定 ----
settings:
  max_items_per_feed: 20        # 1フィードあたり1回で取り込む最大件数
  max_new_items_per_run: 60     # 1回の実行で処理する新規記事の上限（AI無料枠保護）
  request_timeout_sec: 15
  lookback_days: 4              # 何日前までの記事を新規として扱うか（取りこぼし保険）
